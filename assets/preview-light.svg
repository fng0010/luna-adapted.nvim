<text x="72" y="240"><tspan fill="#26262b">    name </tspan><tspan fill="#575760">=</tspan><tspan fill="#26262b"> name </tspan><tspan fill="#575760">or</tspan><tspan fill="#26262b"> </tspan><tspan fill="#526d3d">&quot;Luna&quot;</tspan><tspan fill="#26262b">,</tspan></text>
