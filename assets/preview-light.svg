<text x="72" y="440"><tspan fill="#26262b">    </tspan><tspan fill="#a4512b">return</tspan><tspan fill="#26262b"> string.format(</tspan><tspan fill="#526d3d">&quot;Hello, %s&quot;</tspan><tspan fill="#26262b">, self.name)</tspan></text>
<text x="46" y="465" text-anchor="end" fill="#8f8a83" font-size="13">16</text>
