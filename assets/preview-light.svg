<text x="72" y="565"><tspan fill="#a4512b">local</tspan><tspan fill="#26262b"> luna </tspan><tspan fill="#575760">=</tspan><tspan fill="#26262b"> Moon.new(</tspan><tspan fill="#526d3d">&quot;Crescent&quot;</tspan><tspan fill="#26262b">, </tspan><tspan fill="#a4512b">0.25</tspan><tspan fill="#26262b">)</tspan></text>
