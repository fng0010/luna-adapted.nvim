<text x="72" y="440"><tspan fill="#e4e4e8">    </tspan><tspan fill="#e19067">return</tspan><tspan fill="#e4e4e8"> string.format(</tspan><tspan fill="#9eb38e">&quot;Hello, %s&quot;</tspan><tspan fill="#e4e4e8">, self.name)</tspan></text>
