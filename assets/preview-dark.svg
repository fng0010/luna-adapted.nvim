<text x="72" y="490"><tspan fill="#e4e4e8">  </tspan><tspan fill="#e19067">return</tspan><tspan fill="#e4e4e8"> </tspan><tspan fill="#9eb38e">&quot;See you at moonrise&quot;</tspan></text>
<text x="46" y="515" text-anchor="end" fill="#2f2b2b" font-size="13">18</text>
